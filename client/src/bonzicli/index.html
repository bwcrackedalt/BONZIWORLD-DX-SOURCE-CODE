<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BonziCLI</title>
  <link rel="stylesheet" href="style.css" />
  <script src="floodWorker.js"></script>
</head>
<body>
 
<div id="app">
 
  <div id="topbar">
    <span>BonziCLI</span>
    <button id="clearBtn">Clear</button>
  </div>
 
  <div id="terminal"></div>
 
<div id="inputBar">
  <span class="prompt">></span>
 
  <input
    id="commandInput"
    type="text"
    placeholder="Type a command..."
    autocomplete="off"
  >
</div>
</div>
 
<script src="script.js"></script>
</body>
</html>
