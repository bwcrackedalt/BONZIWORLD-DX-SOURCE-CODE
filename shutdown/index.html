<html>
  <head>
    <meta charset="UTF-8">

    <title>

    </title>
    <style>
      body,
html {
    margin: 0;
    padding: 0;
    font-size: 16px;
}

body,
body * {
    font-family: "Tahoma", sans-serif;
}

input[type="text"] {
    background-color: #fff;
    border: 1px inset #AAA;
    color: #000;
}

.xp_bubble,
#content {
    position: relative;
    background: #ffffe1;
    color: #000;
    -webkit-border-radius: 9px;
    -moz-border-radius: 9px;
    border-radius: 9px;
    border: #000000 solid 1px;
}

#rss {
    position: absolute;
    top: 16px;
    right: 16px;
}

@font-face {
    font-family: 'Tahoma';
    src: url("font/Tahoma/Tahoma.eot#iefix") format("embedded-opentype"), url("font/Tahoma/Tahoma.woff") format("woff"), url("font/Tahoma/Tahoma.ttf") format("truetype"), url("font/Tahoma/Tahoma.svg#Tahoma") format("svg");
    font-weight: normal;
    font-style: normal;
}

html {
    overflow-y: auto;
}

body {
    background-image: linear-gradient(to left, #2e2e2e, #707070), url('your-image.jpg');
      /*background-image: linear-gradient(90deg in hsl longer hue, red, red);*/
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
}

#content {
    width: 75%;
    max-width: 800px;
    margin: 32px auto;
    padding: 16px 32px;
    background-color: rgba(255, 255, 225, 0.8);
    overflow: hidden;
}

#bonziworld {
    display: none;
}

#titlebar {
    background-color: rgba(109, 51, 160, 0.85);
}

gay-big {
    font-size: 1.5em;
}

gay-spoiler {
    background-color: darkslategrey;
    border-radius: 3px;
    color: transparent;
    user-select: none;
    transition: background-color 0.2s, color 0.2s;
    cursor: pointer;
}

gay-spoiler:hover {
    background-color: #777;
}

gay-spoiler.reveal {
    background-color: #5555;
    color: black;
    user-select: all;
    cursor: auto;
}

gay-rainbow {
    background-image: linear-gradient(120deg in hsl longer hue, red, red, red);
    background-size: 500px;
    background-clip: text;
    color: transparent;
    animation: move 2s linear infinite;
}

gay-greenoutline {
    color: #000;
    text-shadow:
        -1px -1px 0 #0f0,
        1px -1px 0 #0f0,
        -1px 1px 0 #0f0,
        1px 1px 0 #0f0,
        0 0 2px #0a0,
        0 0 6px #00ff66,
        0 0 10px #00cc44;
}

gay-fancy {
    display: inline-block;
    font-family: "Brush Script MT", "Lucida Handwriting", "Segoe Script", "Snell Roundhand", "Apple Chancery", cursive;
    font-style: italic;
    font-weight: 700;
    font-size: 1.08em;
    letter-spacing: 0.06em;
    transform: skew(-8deg);
    text-shadow:
        0.5px 0.5px 0 #fff8,
        1px 1px 0 #0002,
        0 0 4px #fff6;
}

@keyframes schizo-jitter {
    0% { transform: translate(0, 0) skew(0deg); }
    20% { transform: translate(-0.5px, 0.5px) skew(-1deg); }
    40% { transform: translate(0.75px, -0.25px) skew(1deg); }
    60% { transform: translate(-0.25px, -0.75px) skew(-0.5deg); }
    80% { transform: translate(0.5px, 0.25px) skew(0.75deg); }
    100% { transform: translate(0, 0) skew(0deg); }
}

gay-schizo {
    display: inline-block;
    position: relative;
    isolation: isolate;
    color: #111;
    letter-spacing: 0.03em;
    text-shadow:
        -1px 0 #f0f,
        1px 0 #0ff,
        0 0 2px #fff,
        0 0 6px #f0f8;
    animation: schizo-jitter 0.12s steps(2, end) infinite;
}

gay-schizo .schizo-main,
gay-schizo .schizo-overlay {
    display: inline-block;
}

gay-schizo .schizo-overlay {
    position: absolute;
    left: 50%;
    top: 0;
    transform: translateX(-50%);
    white-space: nowrap;
    pointer-events: none;
    opacity: 0;
}

gay-schizo.schizo-burst .schizo-overlay {
    opacity: 0.92;
    color: #fff;
    text-shadow:
        -1px 0 #f0f,
        1px 0 #0ff,
        0 0 4px #fff,
        0 0 8px #f0f;
}

gay-schizo.schizo-guilt .schizo-overlay {
    opacity: 1;
    color: #fff;
    background: #400c;
    padding: 0 0.15em;
    border-radius: 0.2em;
    text-shadow:
        0 0 2px #000,
        0 0 8px #f00,
        0 0 14px #f88;
}

gay-code {
    border: 1px solid #bbb;
    background-color: #ddd;
    border-radius: 4px;
    font: monospace;
    padding: 0 0.2em;
}

@keyframes move {
    from {
        background-position-x: 500px;
    }
    to {
        background-position-x: 0;
    }
}

figure {
    float: right;
    border: 1px solid #555555;
    margin: 0;
    padding: 3px;
}

figcaption {
    font-size: 0.8em;
    color: #555555;
      }
